# Supabase Auth settings pushed to mitra-staging on 2026-11-16 (declared keys only; undeclared settings are left unchanged).
# Push with a scratch work directory so the developer's local supabase/config.toml is never used:
#   mkdir <dir>/supabase && cp deploy/supabase-auth/staging.toml <dir>/supabase/config.toml
#   npx supabase config diff --remote=udxzukodfqjzdukweygy --workdir <dir>   (review)
#   npx supabase config push --remote=udxzukodfqjzdukweygy --workdir <dir> --yes
# site_url and the redirect list change to https://staging.inok.my once that domain is protected and attached.
# The email templates (supabase/templates, generated by scripts/build-email-templates.mjs) are NOT pushed yet: the organisation is on the
# Supabase Free plan, and the API answers entitlement_required for template changes until a custom SMTP provider or a paid plan exists.
project_id = "udxzukodfqjzdukweygy"

[auth]
site_url = "https://inok-app-staging.long-wind-0982.workers.dev"
additional_redirect_urls = ["https://inok-app-staging.long-wind-0982.workers.dev/auth/callback"]
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 10
password_requirements = "lower_upper_letters_digits"

[auth.email]
double_confirm_changes = true
enable_confirmations = true
otp_expiry = 3600

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true
